# Serves the SPA. TLS, HSTS and the /api reverse proxy live in the edge
# Nginx (infra/nginx/pos.conf).
server {
    listen 80;
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
