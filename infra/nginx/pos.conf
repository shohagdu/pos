# Edge reverse proxy (staging/production): TLS termination, HSTS, rate limits,
# /api → pos-api, everything else → SPA container. Certificates via ACME.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream pos_api { server api:8080; keepalive 32; }
upstream pos_web { server web:80; }

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 12m;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://pos_api;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ~ ^/(api/|healthz|readyz) {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://pos_api;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        proxy_pass http://pos_web;
    }
}

