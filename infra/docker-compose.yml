# Local development dependencies. The API and frontend run on the host
# (cargo run / npm run dev) for fast iteration; see docs/DEVELOPMENT.md.
name: pos

services:
  mysql:
    image: mysql:8.4.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_only
      MYSQL_DATABASE: pos
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_dev_only"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: pos_minio
      MINIO_ROOT_PASSWORD: pos_minio_dev_only
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:v1.27.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # web UI

volumes:
  mysql-data:
  redis-data:
  minio-data:
